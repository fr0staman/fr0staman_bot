[package]
name = "fr0staman_bot"
version = "1.4.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "fr0staman_bot"
path = "src/main.rs"

[dependencies]
ahash = "0.8.12"
axum = "0.8.9"
axum-prometheus = "0.10.1"
base64 = "0.23.1"
byteorder = "1.5.0"
bytes = "1.12.1"
charts-rs = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
diesel = { version = "2.3.12", default-features = false, features = [
    "chrono",
    "without-deprecated"
] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
futures = "0.3.34"
log = "0.4.33"
num-derive = "0.5.1"
num-traits = "0.2.19"
ogg-opus = { git = "https://github.com/fr0staman/ogg-opus", rev = "486591d3879e23e2f3da3751235ffdc5fc12a417" }
pretty_env_logger = "0.5"
prometheus-client = "0.25.0"
rand = { version = "0.10.2", default-features = false, features = [
    "thread_rng",
    # Seedable RNG, so growth rolls and duels can be tested deterministically.
    "std_rng",
] }
rayon = "1.12.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
teloxide = { git = "https://github.com/teloxide/teloxide.git", rev = "0ca6f7d22410fc043bc52c165f2e69741fd83f1c", features = [
    "macros",
    "webhooks-axum",
] }
thiserror = "2.0.20"
# `time`, `sync` and `net` are used directly (sleep, Mutex/RwLock/oneshot,
# TcpListener). They were only reaching us transitively through teloxide and
# axum, so a bump there could have broken the build.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
] }
unicode-width = "0.2.2"
url = "2.5.8"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
# panic = "abort"
codegen-units = 1
